# Runs on every push and pull request: offline tests + the privacy guard on every tracked file.
# If someone (or a bad merge) commits a private file to this public repo, this turns red.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Privacy guard (every tracked file)
        run: python -m scraper.check_public --tracked
      - name: Tests (offline)
        run: python -m unittest discover -s tests -t .
