# =============================================================================
# sources.yaml  -  Bridge Lead Radar
# Every data source, how it is accessed, and its compliance status.
#
# THE GATE: the scraper runs a source ONLY if ALL of these are true:
#   1. enabled: true
#   2. access is one of: api | rss | page | ats_json   (never "manual")
#   3. tos_reviewed_on is filled in (YYYY-MM-DD) and tos_reviewed_by is filled in
#   4. robots.txt allows the path at run time (checked automatically every run)
# If any check fails, the source is skipped and written to
# data/manual_integration_required.csv. Nothing is ever scraped "anyway".
#
# status values:
#   approved         official API / feed / open data (still needs tos_reviewed_on)
#   pending_review   probably fine, a human must read ToS + robots.txt first
#   manual_required  ToS prohibits automation, or no reliable access. Never scraped.
#
# HOW TO REVIEW A SOURCE (about 15 min):
#   1. Open  <site>/robots.txt  in your browser. Is the path you need "Disallow"?
#   2. Open the site's Terms. Search the page for: scrape, robot, crawl, automated,
#      data mining. Any prohibition = set status: manual_required.
#   3. Look for an API or RSS link. If one exists, prefer it.
#   4. If all clear: set tos_reviewed_by, tos_reviewed_on, enabled: true.
# =============================================================================

settings:
  # PLACEHOLDER: put a real, monitored business email here. It goes in the
  # User-Agent so site owners can contact you or ask you to stop.
  user_agent: "BridgeLeadRadar/1.0 (+https://bridgetalentgroup.com)"
  respect_robots_txt: true          # do not change
  min_seconds_between_requests: 2   # per domain
  max_requests_per_source_per_run: 200
  cache_ttl_hours: 20               # re-use cached pages within a run window
  request_timeout_seconds: 20
  retry_count: 2
  stop_source_after_consecutive_errors: 3   # e.g. 403/429 -> stop, log, flag manual
  store_article_text: false         # headline + own summary + link only (copyright)
  scope_country: "Kenya + Africa/global eligible remote roles"

# -----------------------------------------------------------------------------
# ENGINE 1 - Active job leads
# -----------------------------------------------------------------------------
engine1_jobs:
  - id: remotive_api
    name: Remotive global remote jobs API
    url: https://remotive.com/api/remote-jobs?limit=500
    access: api
    status: approved
    enabled: true
    tos_reviewed_by: "BridgeRadar technical integration"
    tos_reviewed_on: "2026-11-03"
    finding: "Official API feed for worldwide remote roles. Store structured fields and source link only."
    scope: global_remote
    max_requests: 20

  - id: arbeitnow_api
    name: Arbeitnow global remote job API
    url: https://www.arbeitnow.com/api/job-board-api
    access: api
    status: approved
    enabled: true
    tos_reviewed_by: "BridgeRadar technical integration"
    tos_reviewed_on: "2026-11-03"
    finding: "Official public job-board API for global roles; remote roles are classified separately."
    scope: global_remote
    max_requests: 20

  - id: remoteok_api
    name: Remote OK global remote jobs API
    url: https://remoteok.com/api
    access: api
    status: approved
    enabled: true
    tos_reviewed_by: "BridgeRadar technical integration"
    tos_reviewed_on: "2026-11-03"
    finding: "Public remote-job feed. Official listing fields and source links are stored; no job text is retained."
    scope: global_remote
    max_requests: 20

  - id: brightermonday
    name: BrighterMonday Kenya
    url: https://www.brightermonday.co.ke
    access: manual
    status: manual_required
    enabled: false
    tos_reviewed_by: "Claude first pass (page read); human to confirm"
    tos_reviewed_on: "2026-10-22"
    finding: >
      Terms page states site information is for personal, non-commercial use only
      and prohibits data mining, robots and screen scraping without prior written
      consent. It also says advertiser contact details must not be used for
      unsolicited commercial correspondence. => Do not scrape. Do not harvest
      employer contacts from this site (relevant to Engine 3).
    manual_helper: "https://www.brightermonday.co.ke/jobs"
    option: "Ask BrighterMonday in writing about a data/partner feed."

  - id: fuzu
    name: Fuzu
    url: https://www.fuzu.com
    access: manual
    status: manual_required
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    finding: "NOT CONFIRMED. First-pass search returned nothing usable. Default manual until a human reads the ToS and robots.txt."
    manual_helper: "https://www.fuzu.com/kenya/job"

  - id: myjobmag_ke
    name: MyJobMag Kenya
    url: https://www.myjobmag.co.ke
    access: page
    status: pending_review
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    finding: "NOT CONFIRMED. Needs human robots.txt + ToS review."
    manual_helper: "https://www.myjobmag.co.ke"

  - id: talent_com_ke
    name: Talent.com Kenya
    url: https://ke.talent.com
    access: page
    status: pending_review
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    role: "secondary cross-check only; keep the original source link where shown"
    finding: "NOT CONFIRMED."

  - id: kenyamoja
    name: KenyaMoja
    access: page
    status: pending_review
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    finding: "NOT CONFIRMED. Check for RSS/sitemap before building a page scraper."

  - id: careerpointkenya
    name: CareerPointKenya
    access: page
    status: pending_review
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    finding: "NOT CONFIRMED. Low volume expected."

  - id: advance_africa
    name: Advance-Africa
    access: page
    status: pending_review
    enabled: false
    tos_reviewed_by: ""
    tos_reviewed_on: ""
    finding: "NOT CONFIRMED. Check for RSS feed."

  - id: pigiame
    name: Pigiame
    access: manual
    status: manual_required
    enabled: false
    finding: "Classifieds: noisy, fake-listing risk. Manual unless a clean structure + permissive ToS is confirmed."

  - id: linkedin_jobs
    name: LinkedIn jobs
    access: manual
    status: manual_required
    enabled: false
    finding: "LinkedIn's terms are widely understood to prohibit scraping, including public listings. Not re-read in this pass. Manual only."
    manual_helper: "https://www.linkedin.com/jobs/search/?location=Kenya"

  - id: reliefweb
    name: ReliefWeb (jobs API)
    url: https://api.reliefweb.int/v2/jobs
    access: api
    status: approved
    enabled: true                  # requires the RELIEFWEB_APPNAME GitHub secret
    tos_reviewed_by: "Claude first pass (API docs read); human to confirm"
    tos_reviewed_on: "2026-10-22"
    finding: >
      Free API, no fees. A pre-approved appname is required (rule effective
      1 Nov 2025). Data is contributed by partners and may be copyrighted: store
      structured fields + link only. ICP NOTE: these are NGO/humanitarian jobs,
      mostly OUTSIDE your private-sector ICP. Leave disabled unless you want NGO leads.
    secret: RELIEFWEB_APPNAME       # GitHub Secret name

  - id: company_ats
    name: Company career pages and ATS boards (schema.org JobPosting, Greenhouse, Lever, Workable)
    access: ats_json
    status: approved
    enabled: true
    tos_reviewed_by: "Akilipathways Kenya"
    tos_reviewed_on: "2026-11-03"
    finding: "Per-company check. Only companies already in the master list. robots.txt enforced per domain."

  - id: jooble_api
    name: Jooble publisher API
    access: api
    status: pending_review
    enabled: false
    secret: JOOBLE_API_KEY
    finding: "Kenya coverage unconfirmed. Needs free publisher key + ToS read."

