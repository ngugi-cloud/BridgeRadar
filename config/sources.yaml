# -----------------------------------------------------------------------------
# ENGINE 3 - HR / decision-maker contacts
# Phase 1 rule: role-based business emails + names ALREADY published on the
# company's own site. No LinkedIn. No guessed emails. No job-board contact harvesting.
# -----------------------------------------------------------------------------
engine3_contacts:
  phase: 1
  allowed_email_types: [role_based, named_if_published_on_company_site]
  forbid_email_pattern_guessing: true
  forbid_smtp_probing: true         # DNS MX lookup only
  forbid_personal_mobiles: true
  crawl_budget_companies_per_day: 150   # rolling re-verify, ~1/7 of list daily
  retention_months: 12
  sources:
    - {id: company_site, name: Company leadership/team/careers/contact pages, access: page, status: pending_review, enabled: false, tos_reviewed_by: "", tos_reviewed_on: "", note: "per-domain robots.txt check at run time"}
    - {id: search_api, name: Web search API to locate company pages, access: api, status: pending_review, enabled: false, secret: SEARCH_API_KEY}
    - {id: press_named_hr, name: Engine 4 articles naming an HR lead, access: internal, status: approved, enabled: true, tos_reviewed_by: "n/a", tos_reviewed_on: "n/a"}
    - {id: linkedin_company, name: LinkedIn company pages, access: manual, status: manual_required, enabled: false, note: "BD verifies by hand via helper search link"}

