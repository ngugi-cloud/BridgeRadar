# =============================================================================
# imports.yaml - public lists you download yourself, then feed to Engine 2.
#
# WHY: regulator and association sites have page layouts I cannot see from here,
# so instead of guessing scrapers, you (or I, once you share a sample) save the
# public list as a CSV into data/imports/ and describe its columns here.
#
# RULES
#   * Only add a list after reviewing that site's terms (reviewed_by / reviewed_on).
#   * source_url is REQUIRED: the page where the list is published. Every row
#     inherits it so your team can verify before outreach.
#   * columns: map OUR field name -> the CSV's column header. Omit what the file lacks.
#     Fields: name, sub_industry, hq_location, website, licence_number,
#             licence_status, ownership_type, parent_group, size, size_source,
#             facility_level, email (competitor list only)
#   * size is stored ONLY when size_source is also given. No size_source = ignored.
#   * output: master (client universe)  |  competitor_agencies (never a lead)
# =============================================================================
imports: []

